name: Verify Prototype Talk package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test Skill behavior
        run: node --test skills/prototype-talk/scripts/*.test.mjs skills/prototype-talk/scripts/test.mjs
      - name: Build and run extracted release
        run: python3 scripts/verify-release.py
